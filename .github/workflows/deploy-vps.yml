name: Deploy tested release to Hostinger VPS

on:
  workflow_run:
    workflows:
      - Full test suite
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  manual-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: dotnet restore
      - run: dotnet test --configuration Release --no-restore
      - run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

  deploy:
    needs: manual-tests
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'online-development') ||
        (github.event_name == 'workflow_dispatch' && needs.manual-tests.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Create immutable release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.online-storage \
            --exclude=.env \
            --exclude=output \
            --exclude=test-results \
            -czf "/tmp/tasareehapp-${RELEASE_SHA}.tar.gz" .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tasareehapp
          chmod 600 ~/.ssh/tasareehapp
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload tested release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/tasareehapp \
            "/tmp/tasareehapp-${RELEASE_SHA}.tar.gz" \
            ops/deploy-release.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Deploy, verify, and roll back on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/tasareehapp "$VPS_USER@$VPS_HOST" \
            "bash /tmp/deploy-release.sh '/tmp/tasareehapp-${RELEASE_SHA}.tar.gz' '${RELEASE_SHA}'"
